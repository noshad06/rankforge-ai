<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RankForge Admin</title>
<style>body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:25px}.card{background:#0d1a2b;border:1px solid #213651;border-radius:16px;padding:20px;margin:14px 0}input{padding:11px;margin:5px;width:90%;background:#071321;color:white;border:1px solid #29415f;border-radius:9px}button{padding:10px 14px;border:0;border-radius:9px;background:#55d6be;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#081523;padding:16px;border-radius:12px}.stat b{font-size:25px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>RankForge Admin</h1><div id="login" class="card"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Admin Login</button><p id="m"></p></div><div id="panel" style="display:none"><div class="stats" id="stats"></div><div class="card"><h2>Users</h2><div id="users"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});$('login').style.display='none';$('panel').style.display='block';load()}catch(e){$('m').textContent=e.message}}
async function load(){let s=await api('/api/admin/stats');$('stats').innerHTML=Object.entries(s).map(x=>'<div class="stat">'+x[0]+'<br><b>'+x[1]+'</b></div>').join('');let us=await api('/api/admin/users');$('users').innerHTML=us.map(u=>'<div style="padding:10px;border-bottom:1px solid #20334d"><b>'+u.name+'</b> · '+u.email+' · Credits: '+u.credits+' <button onclick="add('+u.id+')">+100</button></div>').join('')}
async function add(id){await api('/api/admin/credits',{method:'POST',body:JSON.stringify({userId:id,credits:100})});load()}
</script></body></html>
