<script>
const $=id=>document.getElementById(id);

async function api(u,o={}){
  u=u.replace(/^\/api\//,'/.netlify/functions/api/');
  let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});
  let j=await r.json();
  if(!r.ok) throw Error(j.error||'Request failed');
  return j;
}

async function login(){
  try{
    await api('/api/admin/login',{
      method:'POST',
      body:JSON.stringify({
        username:$('u').value,
        password:$('p').value
      })
    });
    $('login').style.display='none';
    $('panel').style.display='block';
    load();
  }catch(e){
    $('m').textContent=e.message;
  }
}

async function load(){
  let s=await api('/api/admin/stats');
  $('stats').innerHTML=Object.entries(s).map(x=>
    '<div class="stat">'+x[0]+'<br><b>'+x[1]+'</b></div>'
  ).join('');

  let us=await api('/api/admin/users');
  $('users').innerHTML=us.map(u=>
    '<div style="padding:10px;border-bottom:1px solid #20334d"><b>'+
    u.name+'</b> · '+u.email+' · Credits: '+u.credits+
    ' <button onclick="add('+u.id+')">+100</button></div>'
  ).join('');
}

async function add(id){
  await api('/api/admin/credits',{
    method:'POST',
    body:JSON.stringify({userId:id,credits:100})
  });
  load();
}
                                             </script>
